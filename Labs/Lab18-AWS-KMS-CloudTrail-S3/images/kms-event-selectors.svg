<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="CloudTrail event selection"><title>CloudTrail event selection</title><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#FF9900"/></marker></defs><rect width="900" height="300" rx="12" fill="#101820"/><rect x="0" y="0" width="7" height="300" fill="#FF9900"/><text x="450.0" y="30" text-anchor="middle" fill="#F0F4F8" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">CloudTrail event selection</text><text x="450.0" y="52" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Management events are account activity; data events are scoped to the application bucket</text><rect x="40" y="80" width="385" height="85" rx="8" fill="#18232E" stroke="#F36876" stroke-width="1.7"/><text x="232.5" y="105" text-anchor="middle" fill="#F36876" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Management events</text><text x="232.5" y="126" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Read + write; KMS events included</text><text x="232.5" y="145" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">GenerateDataKey / Decrypt / PutKeyPolicy</text><rect x="475" y="80" width="385" height="85" rx="8" fill="#18232E" stroke="#83BC55" stroke-width="1.7"/><text x="667.5" y="105" text-anchor="middle" fill="#83BC55" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">S3 data events</text><text x="667.5" y="126" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Both read and write; custom ARN prefix</text><text x="667.5" y="145" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">arn:aws:s3:::sy-awstraining-s3/</text><path d="M232 165 V187 H450 V208" stroke="#FF9900" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M667 165 V187 H450 V208" stroke="#FF9900" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="230" y="210" width="440" height="65" rx="8" fill="#18232E" stroke="#B695FF" stroke-width="1.7"/><text x="450.0" y="235" text-anchor="middle" fill="#B695FF" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">SY-KMS-Audit-Trail</text><text x="450.0" y="256" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Individual event records → separate audit bucket</text></svg>
