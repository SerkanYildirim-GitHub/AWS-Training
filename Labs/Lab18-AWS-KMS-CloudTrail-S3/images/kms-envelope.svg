<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Envelope encryption and decryption"><title>Envelope encryption and decryption</title><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#FF9900"/></marker></defs><rect width="900" height="420" rx="12" fill="#101820"/><rect x="0" y="0" width="7" height="420" fill="#FF9900"/><text x="450.0" y="30" text-anchor="middle" fill="#F0F4F8" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">Envelope encryption and decryption</text><text x="450.0" y="52" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">KMS protects the data key; S3 encrypts and decrypts the object payload</text><rect x="40" y="80" width="380" height="70" rx="8" fill="#18232E" stroke="#F36876" stroke-width="1.7"/><text x="230.0" y="105" text-anchor="middle" fill="#F36876" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Upload: GenerateDataKey</text><text x="230.0" y="126" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">KMS returns plaintext and encrypted data key</text><rect x="480" y="80" width="380" height="70" rx="8" fill="#18232E" stroke="#F36876" stroke-width="1.7"/><text x="670.0" y="105" text-anchor="middle" fill="#F36876" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Retrieval: Decrypt</text><text x="670.0" y="126" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">KMS decrypts the stored encrypted data key</text><rect x="40" y="190" width="380" height="75" rx="8" fill="#18232E" stroke="#83BC55" stroke-width="1.7"/><text x="230.0" y="215" text-anchor="middle" fill="#83BC55" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">S3 encrypts the object</text><text x="230.0" y="236" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Plaintext data key used temporarily</text><text x="230.0" y="255" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Plaintext key discarded after use</text><rect x="480" y="190" width="380" height="75" rx="8" fill="#18232E" stroke="#83BC55" stroke-width="1.7"/><text x="670.0" y="215" text-anchor="middle" fill="#83BC55" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">S3 decrypts the object</text><text x="670.0" y="236" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Plaintext data key used temporarily</text><text x="670.0" y="255" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Object returned over HTTPS</text><path d="M230 150 L230 190" stroke="#FF9900" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M670 150 L670 190" stroke="#FF9900" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="240" y="310" width="420" height="75" rx="8" fill="#18232E" stroke="#FF9900" stroke-width="1.7"/><text x="450.0" y="335" text-anchor="middle" fill="#FF9900" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Stored encrypted object</text><text x="450.0" y="356" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Ciphertext + encrypted data key</text><text x="450.0" y="375" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">No plaintext data key stored with the object</text><path d="M230 265 V290 H345 V310" stroke="#FF9900" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M555 310 V290 H670 V265" stroke="#FF9900" stroke-width="2" fill="none" marker-end="url(#arrow)"/></svg>
