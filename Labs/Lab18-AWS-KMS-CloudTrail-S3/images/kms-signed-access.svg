<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="S3 access and KMS authorization"><title>S3 access and KMS authorization</title><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#FF9900"/></marker></defs><rect width="900" height="290" rx="12" fill="#101820"/><rect x="0" y="0" width="7" height="290" fill="#FF9900"/><text x="450.0" y="30" text-anchor="middle" fill="#F0F4F8" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">S3 access and KMS authorization</text><text x="450.0" y="52" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Signed request ≠ automatic permission to decrypt</text><rect x="35" y="80" width="390" height="70" rx="8" fill="#18232E" stroke="#83BC55" stroke-width="1.7"/><text x="230.0" y="105" text-anchor="middle" fill="#83BC55" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Authorized signed request</text><text x="230.0" y="126" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">SigV4 + S3 authorization</text><rect x="475" y="80" width="390" height="70" rx="8" fill="#18232E" stroke="#F36876" stroke-width="1.7"/><text x="670.0" y="105" text-anchor="middle" fill="#F36876" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Unsigned direct URL</text><text x="670.0" y="126" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">No signed authentication</text><rect x="35" y="180" width="390" height="75" rx="8" fill="#18232E" stroke="#83BC55" stroke-width="1.7"/><text x="230.0" y="205" text-anchor="middle" fill="#83BC55" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">KMS Decrypt allowed</text><text x="230.0" y="226" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">S3 returns decrypted object over HTTPS</text><text x="230.0" y="245" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Stored object remains encrypted</text><rect x="475" y="180" width="390" height="75" rx="8" fill="#18232E" stroke="#F36876" stroke-width="1.7"/><text x="670.0" y="205" text-anchor="middle" fill="#F36876" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">AccessDenied</text><text x="670.0" y="226" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Object not delivered</text><text x="670.0" y="245" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Anonymous test does not isolate KMS</text><path d="M230 150 L230 180" stroke="#FF9900" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M670 150 L670 180" stroke="#FF9900" stroke-width="2" fill="none" marker-end="url(#arrow)"/></svg>
