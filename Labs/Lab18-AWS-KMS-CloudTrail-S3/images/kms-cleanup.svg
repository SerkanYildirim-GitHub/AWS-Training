<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="KMS cleanup — dependency order"><title>KMS cleanup — dependency order</title><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#FF9900"/></marker></defs><rect width="900" height="290" rx="12" fill="#101820"/><rect x="0" y="0" width="7" height="290" fill="#FF9900"/><text x="450.0" y="30" text-anchor="middle" fill="#F0F4F8" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">KMS cleanup — dependency order</text><text x="450.0" y="52" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">A pending-deletion key cannot perform cryptographic operations</text><rect x="25" y="90" width="200" height="77" rx="8" fill="#18232E" stroke="#B695FF" stroke-width="1.7"/><text x="125.0" y="115" text-anchor="middle" fill="#B695FF" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Stop trail</text><text x="125.0" y="136" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Remove duplicate logging</text><path d="M225 129 L242 129" stroke="#FF9900" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="242" y="90" width="200" height="77" rx="8" fill="#18232E" stroke="#83BC55" stroke-width="1.7"/><text x="342.0" y="115" text-anchor="middle" fill="#83BC55" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Delete test version</text><text x="342.0" y="136" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Remove known dependency</text><path d="M442 129 L459 129" stroke="#FF9900" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="459" y="90" width="200" height="77" rx="8" fill="#18232E" stroke="#FF9900" stroke-width="1.7"/><text x="559.0" y="115" text-anchor="middle" fill="#FF9900" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Schedule key deletion</text><text x="559.0" y="136" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">7-day waiting period</text><path d="M659 129 L676 129" stroke="#FF9900" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="676" y="90" width="200" height="77" rx="8" fill="#18232E" stroke="#F36876" stroke-width="1.7"/><text x="776.0" y="115" text-anchor="middle" fill="#F36876" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Permanent deletion</text><text x="776.0" y="136" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Irreversible after waiting</text><rect x="60" y="205" width="780" height="48" rx="8" fill="#18232E" stroke="#6EA8FE" stroke-width="1.7"/><text x="450" y="225" text-anchor="middle" fill="#F0F4F8" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Retain prior S3 objects and original CloudTrail trail</text><text x="450" y="242" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Cancel scheduled deletion and re-enable only if an unexpected dependency is found</text></svg>
