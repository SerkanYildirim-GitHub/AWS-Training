<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Automatic rotation — one logical KMS key"><title>Automatic rotation — one logical KMS key</title><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#FF9900"/></marker></defs><rect width="900" height="270" rx="12" fill="#101820"/><rect x="0" y="0" width="7" height="270" fill="#FF9900"/><text x="450.0" y="30" text-anchor="middle" fill="#F0F4F8" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">Automatic rotation — one logical KMS key</text><text x="450.0" y="52" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Configured: 365 days; no rotation performed during the exercise</text><rect x="50" y="85" width="350" height="85" rx="8" fill="#18232E" stroke="#6EA8FE" stroke-width="1.7"/><text x="225.0" y="110" text-anchor="middle" fill="#6EA8FE" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">Original key material</text><text x="225.0" y="131" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Previous ciphertext remains decryptable</text><text x="225.0" y="150" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Logical key ID and alias unchanged</text><rect x="500" y="85" width="350" height="85" rx="8" fill="#18232E" stroke="#83BC55" stroke-width="1.7"/><text x="675.0" y="110" text-anchor="middle" fill="#83BC55" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">New key material</text><text x="675.0" y="131" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">New encryption uses latest material</text><text x="675.0" y="150" text-anchor="middle" fill="#C1CCD6" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400">Previous material retained by KMS</text><path d="M400 127 L500 127" stroke="#FF9900" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="450" y="112" text-anchor="middle" fill="#FF9900" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">Rotate</text><rect x="140" y="205" width="620" height="38" rx="8" fill="#18232E" stroke="#F36876" stroke-width="1.7"/><text x="450" y="229" text-anchor="middle" fill="#F0F4F8" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700">Same key ARN and key policy · no automatic object re-encryption</text></svg>
