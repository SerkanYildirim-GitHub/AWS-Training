<svg xmlns="http://www.w3.org/2000/svg" width="900" height="416" viewBox="0 0 900 416" role="img"><title>Versioning and delete marker recovery</title><rect width="900" height="416" rx="14" fill="#f7f9fb"/><rect width="900" height="76" rx="12" fill="#232f3e"/><rect y="69" width="900" height="7" fill="#ff9900"/><g font-family="Arial,sans-serif"><text x="25" y="31" font-size="24" font-weight="bold" fill="white">Versioning and delete marker recovery</text><text x="25" y="55" font-size="15" fill="#d9e2ec">Observed sequence for Sy-S3-storage-info.txt</text><rect x="25" y="90" width="850" height="59" rx="7" fill="white" stroke="#cbd5e1"/><rect x="25" y="90" width="6" height="59" rx="3" fill="#3f8624"/><text x="44" y="113" font-size="17" font-weight="bold" fill="#232f3e">Original version: null</text><text x="44" y="134" font-size="14" fill="#475569">137 B — uploaded before versioning</text><path d="M450 149 v13 l-5 -5 m5 5 l5 -5" fill="none" stroke="#c56b00" stroke-width="2"/><rect x="25" y="167" width="850" height="59" rx="7" fill="white" stroke="#cbd5e1"/><rect x="25" y="167" width="6" height="59" rx="3" fill="#c56b00"/><text x="44" y="190" font-size="17" font-weight="bold" fill="#232f3e">New version: 257 B</text><text x="44" y="211" font-size="14" fill="#475569">Original retained as noncurrent</text><path d="M450 226 v13 l-5 -5 m5 5 l5 -5" fill="none" stroke="#c56b00" stroke-width="2"/><rect x="25" y="244" width="850" height="59" rx="7" fill="white" stroke="#cbd5e1"/><rect x="25" y="244" width="6" height="59" rx="3" fill="#3f8624"/><text x="44" y="267" font-size="17" font-weight="bold" fill="#232f3e">Ordinary deletion</text><text x="44" y="288" font-size="14" fill="#475569">Current delete marker hides the object; both data versions remain</text><path d="M450 303 v13 l-5 -5 m5 5 l5 -5" fill="none" stroke="#c56b00" stroke-width="2"/><rect x="25" y="321" width="850" height="59" rx="7" fill="white" stroke="#cbd5e1"/><rect x="25" y="321" width="6" height="59" rx="3" fill="#c56b00"/><text x="44" y="344" font-size="17" font-weight="bold" fill="#232f3e">Remove only delete marker</text><text x="44" y="365" font-size="14" fill="#475569">257 B version becomes current again; 137 B version retained</text></g></svg>