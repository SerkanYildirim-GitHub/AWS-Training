<svg xmlns="http://www.w3.org/2000/svg" width="900" height="416" viewBox="0 0 900 416" role="img"><title>Lifecycle management</title><rect width="900" height="416" rx="14" fill="#f7f9fb"/><rect width="900" height="76" rx="12" fill="#232f3e"/><rect y="69" width="900" height="7" fill="#ff9900"/><g font-family="Arial,sans-serif"><text x="25" y="31" font-size="24" font-weight="bold" fill="white">Lifecycle management</text><text x="25" y="55" font-size="15" fill="#d9e2ec">Configured rule • S3-Object-Retention-Policy</text><rect x="25" y="90" width="850" height="59" rx="7" fill="white" stroke="#cbd5e1"/><rect x="25" y="90" width="6" height="59" rx="3" fill="#3f8624"/><text x="44" y="113" font-size="17" font-weight="bold" fill="#232f3e">Current versions</text><text x="44" y="134" font-size="14" fill="#475569">No transition or expiration action</text><path d="M450 149 v13 l-5 -5 m5 5 l5 -5" fill="none" stroke="#c56b00" stroke-width="2"/><rect x="25" y="167" width="850" height="59" rx="7" fill="white" stroke="#cbd5e1"/><rect x="25" y="167" width="6" height="59" rx="3" fill="#c56b00"/><text x="44" y="190" font-size="17" font-weight="bold" fill="#232f3e">Noncurrent versions</text><text x="44" y="211" font-size="14" fill="#475569">Eligible for permanent deletion after 30 days noncurrent</text><path d="M450 226 v13 l-5 -5 m5 5 l5 -5" fill="none" stroke="#c56b00" stroke-width="2"/><rect x="25" y="244" width="850" height="59" rx="7" fill="white" stroke="#cbd5e1"/><rect x="25" y="244" width="6" height="59" rx="3" fill="#3f8624"/><text x="44" y="267" font-size="17" font-weight="bold" fill="#232f3e">Expired delete markers</text><text x="44" y="288" font-size="14" fill="#475569">Remove when no underlying data versions remain</text><path d="M450 303 v13 l-5 -5 m5 5 l5 -5" fill="none" stroke="#c56b00" stroke-width="2"/><rect x="25" y="321" width="850" height="59" rx="7" fill="white" stroke="#cbd5e1"/><rect x="25" y="321" width="6" height="59" rx="3" fill="#c56b00"/><text x="44" y="344" font-size="17" font-weight="bold" fill="#232f3e">Incomplete multipart uploads</text><text x="44" y="365" font-size="14" fill="#475569">Abort after 7 days; remove unfinished parts</text></g></svg>