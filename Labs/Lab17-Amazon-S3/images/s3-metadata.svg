<svg xmlns="http://www.w3.org/2000/svg" width="900" height="416" viewBox="0 0 900 416" role="img"><title>Tags and metadata</title><rect width="900" height="416" rx="14" fill="#f7f9fb"/><rect width="900" height="76" rx="12" fill="#232f3e"/><rect y="69" width="900" height="7" fill="#ff9900"/><g font-family="Arial,sans-serif"><text x="25" y="31" font-size="24" font-weight="bold" fill="white">Tags and metadata</text><text x="25" y="55" font-size="15" fill="#d9e2ec">Same-key copy with versioning enabled</text><rect x="25" y="90" width="850" height="59" rx="7" fill="white" stroke="#cbd5e1"/><rect x="25" y="90" width="6" height="59" rx="3" fill="#3f8624"/><text x="44" y="113" font-size="17" font-weight="bold" fill="#232f3e">Version 2 • 257 B</text><text x="44" y="134" font-size="14" fill="#475569">Four object tags; Content-Type: text/plain</text><path d="M450 149 v13 l-5 -5 m5 5 l5 -5" fill="none" stroke="#c56b00" stroke-width="2"/><rect x="25" y="167" width="850" height="59" rx="7" fill="white" stroke="#cbd5e1"/><rect x="25" y="167" width="6" height="59" rx="3" fill="#c56b00"/><text x="44" y="190" font-size="17" font-weight="bold" fill="#232f3e">CopyObject with Specify settings</text><text x="44" y="211" font-size="14" fill="#475569">Copy tags, storage class, encryption and checksum function; replace metadata</text><path d="M450 226 v13 l-5 -5 m5 5 l5 -5" fill="none" stroke="#c56b00" stroke-width="2"/><rect x="25" y="244" width="850" height="59" rx="7" fill="white" stroke="#cbd5e1"/><rect x="25" y="244" width="6" height="59" rx="3" fill="#3f8624"/><text x="44" y="267" font-size="17" font-weight="bold" fill="#232f3e">Version 3 • 257 B</text><text x="44" y="288" font-size="14" fill="#475569">Four tags + one system-defined and four user-defined metadata entries</text><path d="M450 303 v13 l-5 -5 m5 5 l5 -5" fill="none" stroke="#c56b00" stroke-width="2"/><rect x="25" y="321" width="850" height="59" rx="7" fill="white" stroke="#cbd5e1"/><rect x="25" y="321" width="6" height="59" rx="3" fill="#c56b00"/><text x="44" y="344" font-size="17" font-weight="bold" fill="#232f3e">Previous version retained</text><text x="44" y="365" font-size="14" fill="#475569">Metadata replacement creates a new object version; tagging alone does not</text></g></svg>