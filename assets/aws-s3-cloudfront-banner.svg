<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title desc">
  <title id="title">AWS Training — Lab 04 S3 Static Website Hosting and CloudFront Distribution</title>
  <desc id="desc">A clean AWS orange, navy, and white vector lab banner with four separated cards. Amazon EC2 uploads the HTML file to Amazon S3, CloudFront uses the public S3 website endpoint over HTTP and delivers the page to browsers over HTTPS. AWS WAF operates in monitor mode.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071525"/><stop offset=".53" stop-color="#0c2239"/><stop offset="1" stop-color="#13283c"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd16a"/><stop offset=".45" stop-color="#ffae28"/><stop offset="1" stop-color="#ff8400"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#183a57"/><stop offset="1" stop-color="#10253c"/></linearGradient>
    <linearGradient id="titleGlow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffad22" stop-opacity=".15"/><stop offset="1" stop-color="#ffad22" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 L 0 0 0 36" fill="none" stroke="#63b9f0" stroke-opacity=".07" stroke-width="1"/></pattern>
    <filter id="shadow" x="-25%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000812" flood-opacity=".38"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#ffad2c" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <clipPath id="frame"><rect width="1800" height="600" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1800" height="600" fill="url(#bg)"/>
    <rect width="1800" height="600" fill="url(#grid)"/>
    <circle cx="1610" cy="-75" r="420" fill="#205e93" opacity=".13"/>
    <circle cx="-110" cy="640" r="500" fill="#ff9900" opacity=".05"/>
    <rect x="0" y="0" width="1800" height="6" fill="url(#orange)"/>
    <rect x="0" y="594" width="1800" height="6" fill="url(#orange)"/>
    <!-- Subtle circuit board accents kept outside the reading area -->
    <g fill="none" stroke="#3c8dbe" stroke-width="2" opacity=".21">
      <path d="M1420 61 h70 l24 -24 h107 l18 -18 h90"/><circle cx="1420" cy="61" r="5" fill="#4ea1cf"/>
      <path d="M1460 92 h135 l25 -26 h130"/><circle cx="1460" cy="92" r="5" fill="#4ea1cf"/>
      <path d="M70 568 h110 l25 -24 h144"/><circle cx="70" cy="568" r="4" fill="#4ea1cf"/>
    </g>

    <!-- Header and title zone: deliberately separate from all diagram cards -->
    <rect x="74" y="36" width="289" height="38" rx="19" fill="#ff9900" fill-opacity=".12" stroke="#ffad30" stroke-opacity=".67"/>
    <circle cx="98" cy="55" r="6" fill="#ffad25"/>
    <text x="116" y="62" fill="#fcdba3" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="2" font-weight="700">AWS TRAINING · LAB 04</text>
    <rect x="74" y="100" width="960" height="128" rx="18" fill="url(#titleGlow)"/>
    <text x="78" y="158" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="800" letter-spacing="-1.9">S3 Static Website Hosting</text>
    <text x="78" y="225" fill="url(#orange)" font-family="Arial,Helvetica,sans-serif" font-size="63" font-weight="800" letter-spacing="-1.5">&amp; CloudFront Distribution</text>
    <rect x="1570" y="123" width="160" height="48" rx="24" fill="#ff9900" fill-opacity=".14" stroke="#ffae30"/>
    <text x="1650" y="153" fill="#ffca74" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800">SAA-C03</text>
    <text x="1115" y="202" fill="#b9d6e7" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">AMAZON EC2  ·  AMAZON S3  ·  CLOUDFRONT  ·  WAF</text>
    <path d="M78 253 H1723" stroke="#386184" stroke-opacity=".65" stroke-width="1.5"/>

    <!-- Arrows and labels: between cards, never on top of other text -->
    <g fill="none" stroke="#ffae2b" stroke-width="3.7" marker-end="url(#arrow)">
      <path d="M443 366 H486"/>
      <path d="M873 366 H916"/>
      <path d="M1303 366 H1346"/>
    </g>
    <g fill="#ffd18b" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing=".5">
      <text x="467" y="340">UPLOAD</text>
      <text x="895" y="340">HTTP</text>
      <text x="1325" y="340">HTTPS</text>
    </g>

<g filter="url(#shadow)"><rect x="75" y="290" width="355" height="198" rx="19" fill="url(#card)" stroke="#468db7" stroke-width="2"/>
      <rect x="92" y="308" width="79" height="79" rx="14" fill="#468db7" fill-opacity=".14" stroke="#468db7" stroke-opacity=".56"/>
      <text x="186" y="344" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="28">Amazon EC2</text>
      <text x="186" y="372" fill="#ffca83" font-family="Arial,Helvetica,sans-serif" font-size="18">Amazon Linux 2023</text>
      <path d="M92 414 H413" stroke="#568cae" stroke-opacity=".5"/>
      <text x="94" y="448" fill="#c6ddea" font-family="Arial,Helvetica,sans-serif" font-size="18">Created and uploaded index.html</text></g>
<g transform="translate(99 313)" fill="none" stroke="#ffb438" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="18" y="18" width="29" height="29" rx="3"/><rect x="26" y="26" width="13" height="13" stroke-width="2"/>
      <path d="M9 22 h9 M9 31 h9 M9 40 h9 M47 22 h9 M47 31 h9 M47 40 h9 M22 9 v9 M31 9 v9 M40 9 v9 M22 47 v9 M31 47 v9 M40 47 v9"/></g>
<g filter="url(#shadow)"><rect x="505" y="290" width="355" height="198" rx="19" fill="url(#card)" stroke="#468db7" stroke-width="2"/>
      <rect x="522" y="308" width="79" height="79" rx="14" fill="#468db7" fill-opacity=".14" stroke="#468db7" stroke-opacity=".56"/>
      <text x="616" y="344" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="28">Amazon S3</text>
      <text x="616" y="372" fill="#ffca83" font-family="Arial,Helvetica,sans-serif" font-size="18">Static website hosting</text>
      <path d="M522 414 H843" stroke="#568cae" stroke-opacity=".5"/>
      <text x="524" y="448" fill="#c6ddea" font-family="Arial,Helvetica,sans-serif" font-size="18">Public-read website endpoint</text></g>
<g transform="translate(529 313)" fill="none" stroke="#9edaf6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="33" cy="15" rx="22" ry="10"/>
      <path d="M11 15 v32 c0 13 44 13 44 0 V15 M11 48 c5 13 38 13 44 0"/>
      <path d="M43 35 l7 0 m-3 -4 l4 4 l-4 4"/>
    </g>
<g filter="url(#shadow)"><rect x="935" y="290" width="355" height="198" rx="19" fill="url(#card)" stroke="#ffad2b" stroke-width="2"/>
      <rect x="952" y="308" width="79" height="79" rx="14" fill="#ffad2b" fill-opacity=".14" stroke="#ffad2b" stroke-opacity=".56"/>
      <text x="1046" y="344" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="28">CloudFront</text>
      <text x="1046" y="372" fill="#ffca83" font-family="Arial,Helvetica,sans-serif" font-size="18">Global content delivery</text>
      <path d="M952 414 H1273" stroke="#568cae" stroke-opacity=".5"/>
      <text x="954" y="448" fill="#c6ddea" font-family="Arial,Helvetica,sans-serif" font-size="18">AWS WAF · monitor mode</text></g>
<g transform="translate(959 313)" fill="none" stroke="#ffb438" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="30" cy="30" r="24"/>
      <path d="M6 30 h48 M30 6 c-13 13 -13 35 0 48 M30 6 c13 13 13 35 0 48"/>
      <path d="M11 18 q19 12 38 0 M11 42 q19 -12 38 0" stroke-width="2"/>
    </g>
<g filter="url(#shadow)"><rect x="1365" y="290" width="355" height="198" rx="19" fill="url(#card)" stroke="#468db7" stroke-width="2"/>
      <rect x="1382" y="308" width="79" height="79" rx="14" fill="#468db7" fill-opacity=".14" stroke="#468db7" stroke-opacity=".56"/>
      <text x="1476" y="344" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="28">Web browser</text>
      <text x="1476" y="372" fill="#ffca83" font-family="Arial,Helvetica,sans-serif" font-size="18">HTTPS distribution URL</text>
      <path d="M1382 414 H1703" stroke="#568cae" stroke-opacity=".5"/>
      <text x="1384" y="448" fill="#c6ddea" font-family="Arial,Helvetica,sans-serif" font-size="18">Verified HTML page delivered</text></g>
<g transform="translate(1389 313)" fill="none" stroke="#9edaf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="10" width="60" height="43" rx="5"/>
      <path d="M3 22 h60"/><circle cx="12" cy="16" r="1" fill="#9edaf6"/><circle cx="20" cy="16" r="1" fill="#9edaf6"/>
      <path d="M24 39 l8 7 l13 -15" stroke="#ffb438" stroke-width="4"/>
    </g>
    <!-- Bottom concise lab summary -->
    <g font-family="Arial,Helvetica,sans-serif">
      <rect x="75" y="514" width="1650" height="51" rx="12" fill="#0b2033" stroke="#356080" stroke-width="1.5"/>
      <circle cx="110" cy="539" r="7" fill="#ffae2b"/>
      <text x="131" y="546" fill="#ffffff" font-size="22" font-weight="700">EC2 → S3 website → CloudFront → HTTPS</text>
      <path d="M795 524 v29" stroke="#568cae" stroke-opacity=".65"/>
      <text x="833" y="546" fill="#bdd6e8" font-size="20">Website delivery verified</text>
      <path d="M1155 524 v29" stroke="#568cae" stroke-opacity=".65"/>
      <text x="1190" y="546" fill="#ffcf7e" font-size="20" font-weight="600">WAF: Monitor mode</text>
    </g>
  </g>
</svg>